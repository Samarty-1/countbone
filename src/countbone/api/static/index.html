<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>countbone</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --ink: #14181d; --muted: #6b7480;
    --line: #dfe3e8; --accent: #2f6feb; --ok: #1f9254; --warn: #b26a00; --bad: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151a; --panel:#1a1e25; --ink:#e7eaee; --muted:#95a0ad;
            --line:#2b313a; --accent:#5b8dee; --ok:#3ecf8e; --warn:#e0a33a; --bad:#e5695c; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
  header { padding:18px 20px; border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:baseline; flex-wrap:wrap; }
  h1 { font-size:18px; margin:0; letter-spacing:-0.01em; }
  h2 { font-size:14px; margin:0 0 12px; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted); }
  .sub { color:var(--muted); font-size:13px; }
  main { display:grid; grid-template-columns: 320px 1fr; gap:16px; padding:16px; align-items:start; }
  @media (max-width: 880px) { main { grid-template-columns: 1fr; } }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .panel + .panel { margin-top:16px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; }
  th { color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:0.04em; }
  td.num, th.num { text-align:right; }
  .run { padding:9px 10px; border-radius:8px; cursor:pointer; border:1px solid transparent; }
  .run:hover { border-color:var(--line); }
  .run.active { background:color-mix(in srgb, var(--accent) 12%, transparent); border-color:var(--accent); }
  .run .id { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; }
  .pill { display:inline-block; padding:1px 8px; border-radius:999px; font-size:11px; border:1px solid var(--line); }
  .pill.ok { color:var(--ok); border-color:var(--ok); }
  .pill.warn { color:var(--warn); border-color:var(--warn); }
  .pill.bad { color:var(--bad); border-color:var(--bad); }
  .bar { height:6px; border-radius:3px; background:var(--line); overflow:hidden; min-width:70px; }
  .bar > i { display:block; height:100%; background:var(--ok); }
  .bar.low > i { background:var(--bad); }
  button { font:inherit; padding:5px 11px; border-radius:7px; border:1px solid var(--line);
           background:var(--panel); color:var(--ink); cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  input, select { font:inherit; padding:5px 8px; border-radius:7px; border:1px solid var(--line);
                  background:var(--panel); color:var(--ink); }
  .review { display:flex; gap:12px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .review img { width:72px; height:72px; object-fit:cover; border-radius:6px; border:1px solid var(--line); background:var(--bg); }
  .grow { flex:1 1 200px; }
  .empty { color:var(--muted); padding:8px 0; }
  code { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .stat { display:flex; gap:20px; flex-wrap:wrap; margin-bottom:14px; }
  .stat div span { display:block; font-size:20px; font-variant-numeric:tabular-nums; }
  .stat div small { color:var(--muted); text-transform:uppercase; font-size:11px; letter-spacing:0.05em; }
  .warnings { color:var(--warn); margin:0; padding-left:18px; }
</style>
</head>
<body>
<header>
  <h1>countbone</h1>
  <span class="sub" id="health">connecting…</span>
  <span class="grow"></span>
  <span class="row">
    <input id="path" placeholder="server path to a video" size="28">
    <button class="primary" id="go">Count</button>
  </span>
</header>

<main>
  <section>
    <div class="panel">
      <h2>Runs</h2>
      <div id="runs"><p class="empty">No runs yet.</p></div>
    </div>
    <div class="panel">
      <h2>Plugins</h2>
      <div id="plugins" class="sub"></div>
    </div>
  </section>

  <section>
    <div class="panel" id="detail">
      <h2>Result</h2>
      <p class="empty">Select a run.</p>
    </div>
    <div class="panel">
      <h2>Review queue</h2>
      <div id="reviews"><p class="empty">Nothing waiting.</p></div>
    </div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const pct = (v) => (v == null ? "—" : Math.round(v * 100) + "%");
let selected = null;

async function api(path, options) {
  const res = await fetch(path, options);
  if (!res.ok) throw new Error((await res.text()) || res.statusText);
  return res.status === 204 ? null : res.json();
}

function confBar(v) {
  const low = v < 0.6 ? " low" : "";
  return `<div class="bar${low}"><i style="width:${Math.round((v || 0) * 100)}%"></i></div>`;
}

async function loadHealth() {
  try {
    const h = await api("/api/health");
    $("health").textContent =
      `detect: ${h.detect} · identify: ${h.identify} · count: ${h.count} · ${h.plugins.length} plugins`;
  } catch (e) { $("health").textContent = "api unreachable"; }
}

async function loadPlugins() {
  const rows = await api("/api/plugins");
  $("plugins").innerHTML = rows.map(p =>
    `<div class="row" style="justify-content:space-between">
       <span><code>${p.name}</code> <span class="sub">${p.layer}</span></span>
       <span class="pill ${p.enabled ? "ok" : ""}">${p.enabled ? "on" : "off"}</span>
     </div>`).join("");
}

async function loadRuns() {
  const data = await api("/api/runs");
  const live = data.in_flight.filter(r => r.status !== "done");
  const parts = [];
  for (const r of live) {
    parts.push(`<div class="run"><span class="id">${r.run_id}</span>
      <span class="pill ${r.status === "failed" ? "bad" : "warn"}">${r.status}</span>
      ${r.error ? `<div class="sub">${r.error}</div>` : ""}</div>`);
  }
  for (const r of data.runs) {
    const cls = r.run_id === selected ? "run active" : "run";
    const flag = r.needs_review ? `<span class="pill warn">review</span>`
                                : `<span class="pill ok">clean</span>`;
    parts.push(`<div class="${cls}" data-run="${r.run_id}">
        <div class="row" style="justify-content:space-between">
          <span class="id">${r.run_id}</span>${flag}
        </div>
        <div class="sub">${r.total} units · ${pct(r.overall_confidence)} · ${new Date(r.started_at * 1000).toLocaleString()}</div>
      </div>`);
  }
  $("runs").innerHTML = parts.join("") || `<p class="empty">No runs yet.</p>`;
  document.querySelectorAll("[data-run]").forEach(el =>
    el.onclick = () => { selected = el.dataset.run; loadRuns(); loadDetail(); });
  if (live.length) setTimeout(loadRuns, 1500);
}

async function loadDetail() {
  if (!selected) return;
  const run = await api(`/api/runs/${selected}`);
  if (run.pending) {
    $("detail").innerHTML = `<h2>Result</h2><p class="empty">${run.pending.status}…</p>`;
    return;
  }
  const meta = run.meta || {};
  const rows = run.counts.map(c => `
    <tr>
      <td><code>${c.sku}</code><div class="sub">${c.label || ""}</div></td>
      <td class="num">${c.count}</td>
      <td class="num">${c.expected ?? "—"}</td>
      <td class="num">${c.variance == null ? "—" : (c.variance > 0 ? "+" : "") + c.variance}</td>
      <td>${confBar(c.confidence)}<span class="sub">${pct(c.confidence)}</span></td>
    </tr>`).join("");
  const warnings = (meta.warnings || []).map(w => `<li>${w}</li>`).join("");
  $("detail").innerHTML = `
    <h2>Result — <code>${run.run_id}</code></h2>
    <div class="stat">
      <div><span>${run.total}</span><small>units</small></div>
      <div><span>${pct(run.overall_confidence)}</span><small>confidence</small></div>
      <div><span>${run.frames_used}/${run.frames_read}</span><small>frames used</small></div>
      <div><span>${run.tracks}</span><small>objects tracked</small></div>
      <div><span>${run.reviews.filter(r => r.status === "pending").length}</span><small>in review</small></div>
    </div>
    <table><thead><tr><th>SKU</th><th class="num">Counted</th><th class="num">Expected</th>
      <th class="num">Variance</th><th>Confidence</th></tr></thead><tbody>${rows}</tbody></table>
    ${warnings ? `<ul class="warnings">${warnings}</ul>` : ""}
    <p class="sub">source <code>${run.source}</code> · config <code>${run.config_fingerprint || "—"}</code>
    ${meta.audit ? `· manifest <code>${meta.audit.manifest_sha256.slice(0, 12)}</code>` : ""}</p>`;
}

async function loadReviews() {
  const rows = await api("/api/reviews?status=pending");
  if (!rows.length) { $("reviews").innerHTML = `<p class="empty">Nothing waiting.</p>`; return; }
  $("reviews").innerHTML = rows.map(r => `
    <div class="review" data-review="${r.review_id}">
      ${r.crop_path
        ? `<img src="/api/runs/${r.run_id}/artifacts/${r.crop_path.replaceAll("\\\\", "/")}" alt="">`
        : `<div class="bar" style="width:72px;height:72px"></div>`}
      <div class="grow">
        <div><code>${r.sku}</code> <span class="pill ${r.confidence < 0.5 ? "bad" : "warn"}">${pct(r.confidence)}</span></div>
        <div class="sub">${r.reason} · run <code>${r.run_id}</code>${r.frame_index >= 0 ? ` · frame ${r.frame_index}` : ""}</div>
      </div>
      <input class="fix" placeholder="correct SKU" size="12">
      <button data-act="accepted">Accept</button>
      <button data-act="corrected">Correct</button>
      <button data-act="rejected">Reject</button>
    </div>`).join("");

  document.querySelectorAll("[data-review] button").forEach(btn => {
    btn.onclick = async () => {
      const row = btn.closest("[data-review]");
      const status = btn.dataset.act;
      const resolved_sku = row.querySelector(".fix").value.trim() || null;
      if (status === "corrected" && !resolved_sku) { row.querySelector(".fix").focus(); return; }
      await api(`/api/reviews/${row.dataset.review}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ status, resolved_sku, reviewer: "dashboard" }),
      });
      loadReviews(); loadDetail();
    };
  });
}

$("go").onclick = async () => {
  const path = $("path").value.trim();
  if (!path) return;
  try {
    const res = await api("/api/runs", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ path }),
    });
    selected = res.run_id;
    loadRuns();
  } catch (e) { alert(e.message); }
};

loadHealth(); loadPlugins(); loadRuns(); loadReviews();
setInterval(() => { loadRuns(); loadReviews(); }, 8000);
</script>
</body>
</html>
